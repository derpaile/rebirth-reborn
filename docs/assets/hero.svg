<path d="M40 40h1520v440H40z" fill="none" stroke="#4c5842"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="80" y="98" fill="#baff3b" font-size="18" letter-spacing="5">INDEPENDENT ACID MACHINES / NATIVE MACOS</text><text x="75" y="214" fill="#f0f2e9" font-weight="900" font-size="108" letter-spacing="-6">REBIRTH</text><text x="75" y="325" fill="#baff3b" font-weight="900" font-size="108" letter-spacing="-6">REBORN.</text><text x="82" y="368" fill="#b3baa9" font-size="22">Two basslines. Twenty-two drums. One more night.</text></g>
