name: Native macOS build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remake:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - name: Audit publication boundary
        run: python3 scripts/audit-public.py
      - name: Build and check asset-free app
        run: bash Reborn/build-app.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent "Reborn/dist/Reborn².app" /tmp/Reborn-Squared-macOS-arm64.zip
      - name: Upload native build
        uses: actions/upload-artifact@v7
        with:
          name: Reborn-Squared-macOS-arm64
          path: /tmp/Reborn-Squared-macOS-arm64.zip
