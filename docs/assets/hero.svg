<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="520" viewBox="0 0 1600 520" role="img" aria-labelledby="title desc">
<title id="title">Rebirth Reborn — acid machines, second life</title><desc id="desc">Original artwork with a dark industrial grid, lime typography and a sixteen-step sequencer.</desc>
<defs><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#293026" stroke-width="1"/></pattern><linearGradient id="metal" x2="0" y2="1"><stop stop-color="#deded1"/><stop offset="1" stop-color="#949b8c"/></linearGradient></defs>
